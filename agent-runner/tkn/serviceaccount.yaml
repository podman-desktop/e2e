# ServiceAccount for agent TaskRuns. It holds no RoleBindings and mounts no
# token, so a prompt-injected agent cannot use the Kubernetes API. Bind it per
# pipelineTask with taskRunSpecs (see README.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-runner
  labels:
    app.kubernetes.io/name: agent-runner
automountServiceAccountToken: false

github:
  cli_path: "gh"  # Path to gh CLI binary (default: "gh" in PATH)
  max_retries: 3

repositories:
  core:
    - "podman-desktop/podman-desktop"
    - "podman-desktop/e2e"
  custom: []
    # Add extra repositories not covered by core or domains.json, eg:
    # - "owner/repo"
  domains_json: "/home/odockal/git/podman-desktop-internal/domains.json"
  domains_user_name: "Ondrej"  # Your name as it appears in domains.json qe_owners

output:
  base_dir: "output"

pr_filters:
  labels:
    - "qe/testing-required"
    - "qe/review"
    - "domain/qe/inreview"
    - "domain/qe"
  assignee_teams:
    - "podman-desktop/qe-reviewers"
  qe_reviewers:
    - "odockal"
    # Add more QE team GitHub usernames here
  max_results: 500  # Max open PRs fetched per repo before QE filtering (gh CLI default is only 30)

workflow_filters:
  overnight_start_hour: 18  # Look for failures from yesterday at this hour until now
  default_name_pattern: "e2e"  # Default: match workflows containing this (case-insensitive)
  exclude_workflows:
    - "pr-check"  # Workflow names to always exclude (case-insensitive substring match)
  repo_workflows:
    # Extra workflow names to include per repo, on top of the default_name_pattern.
    # Exclusions still apply.
    "podman-desktop/podman-desktop":
      - "e2e"
      - "daily-testing-build"
      - "managed-configuration"
      - "next-build"
    "podman-desktop/e2e":
      - "e2e"
      - "stress"

cve_filters:
  states:
    - "open"
  severities:
    - "critical"
    - "high"
    - "medium"
    - "low"

issue_filters:
  labels:
    - "kind/bug"
  states:
    - "open"
  max_age_days: 30
  max_results: 500  # Max issues fetched per repo before age filtering (gh CLI default is only 30)

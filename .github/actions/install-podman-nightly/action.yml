name: 'Install Nightly Podman on Windows Host'
description: 'Downloads a nightly Podman MSI from GitHub Actions artifacts and installs it on the remote Windows host via SSH.'
inputs:
  download-url:
    description: 'GitHub Actions artifact archive URL for the nightly Podman MSI (from fetch-latest-podman-version-windows).'
    required: true
  github-token:
    description: 'GitHub token with actions:read permission for downloading the artifact.'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Download and install nightly Podman on Windows host
      shell: bash
      run: |
        set -euo pipefail
        SSH_HOST=$(cat host)
        SSH_USER=$(cat username)
        SSH_OPTS="-i id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=1200"

        echo "Downloading nightly Podman artifact..."
        curl --fail --location -H "Authorization: Bearer ${{ inputs.github-token }}" \
          -o podman-nightly.zip '${{ inputs.download-url }}'

        echo "Extracting MSI from artifact archive..."
        unzip -qo podman-nightly.zip -d podman-nightly-extract
        MSI_FILE=$(find podman-nightly-extract -name "*.msi" | head -1)

        if [ -z "$MSI_FILE" ]; then
          echo "::error::No MSI file found in nightly artifact archive"
          exit 1
        fi
        echo "Nightly MSI: $MSI_FILE"

        echo "Transferring MSI to Windows host..."
        scp $SSH_OPTS "$MSI_FILE" "${SSH_USER}@${SSH_HOST}:C:\\Users\\${SSH_USER}\\podman-nightly.msi"

        echo "Installing Podman MSI on Windows host..."
        ssh $SSH_OPTS ${SSH_USER}@${SSH_HOST} "msiexec /package C:\\Users\\${SSH_USER}\\podman-nightly.msi /quiet /norestart"

        echo "Verifying Podman is on PATH in a fresh session..."
        ssh $SSH_OPTS ${SSH_USER}@${SSH_HOST} "podman --version" || \
          ssh $SSH_OPTS ${SSH_USER}@${SSH_HOST} "powershell -Command \"podman --version\"" || \
          { echo "::error::Podman not found on PATH after MSI install. The e2e-runner expects podman on the system PATH for nightly runs."; exit 1; }

# Runs the same E2E suite as e2e-main.yaml, but with a forwarding proxy
# (Squid) already running on the runner before Podman Desktop is launched,
# and HTTP_PROXY/HTTPS_PROXY exported so the app picks it up via its
# "System" proxy mode. Verifies Podman Desktop behaves correctly when
# opened in an environment with a preconfigured proxy.
name: e2e-tests-proxy

run-name: >-
  ${{ inputs.release_tag
      && format('e2e-tests-proxy [{0}]', inputs.release_tag)
      || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      organization:
        default: 'podman-desktop'
        description: 'Organization/fork of the Podman Desktop repository'
        type: string
        required: true
      repositoryName:
        default: 'podman-desktop'
        description: 'Podman Desktop repository name'
        type: string
        required: true
      branch:
        default: 'main'
        description: 'Podman Desktop repo branch'
        type: string
        required: true
      npm_target:
        default: 'test:e2e:all'
        description: 'The npm target to run tests. Use "test:e2e:all" to run all test suites, including Kubernetes tests.'
        type: string
        required: true
      kind_provider:
        description: 'Kind cluster provider type'
        type: choice
        options:
        - docker
        - podman
        required: false
      release_tag:
        description: 'Tag to identify this run for report-portal'
        type: string
        default: ''
        required: false

permissions:
  contents: read

jobs:
  e2e-tests-proxy:
    name: Run E2E tests behind a proxy - ${{ matrix.installation }}
    runs-on: ubuntu-24.04
    # disable on forks as secrets are not available
    steps:
    - name: Set the default env. variables
      env:
        DEFAULT_NPM_TARGET: 'test:e2e:all'
        DEFAULT_KIND_PROVIDER: 'docker'
        DEFAULT_FORK: 'podman-desktop'
        DEFAULT_BRANCH: 'main'
        DEFAULT_REPOSITORY: 'podman-desktop'
        NPM_TARGET_VALUE: ${{ github.event.inputs.npm_target || env.DEFAULT_NPM_TARGET }}
        KIND_PROVIDER_VALUE: ${{ github.event.inputs.kind_provider || env.DEFAULT_KIND_PROVIDER }}
        FORK: ${{ github.event.inputs.organization || env.DEFAULT_FORK }}
        BRANCH: ${{ github.event.inputs.branch || env.DEFAULT_BRANCH }}
        REPOSITORY: ${{ github.event.inputs.repositoryName || env.DEFAULT_REPOSITORY }}
      run: |
        echo "NPM_TARGET=${NPM_TARGET_VALUE}" >> "$GITHUB_ENV"
        echo "KIND_PROVIDER=${KIND_PROVIDER_VALUE}" >> "$GITHUB_ENV"
        echo "FORK=${FORK}" >> "$GITHUB_ENV"
        echo "BRANCH=${BRANCH}" >> "$GITHUB_ENV"
        echo "REPOSITORY=${REPOSITORY}" >> "$GITHUB_ENV"

    - name: Checkout podman desktop
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        repository: ${{ env.FORK }}/${{ env.REPOSITORY }}
        ref: ${{ env.BRANCH }}
        path: podman-desktop
        persist-credentials: false

    - name: Install Podman v5 using external action
      # Use the action from the other repository
      uses: redhat-actions/podman-install@aea6ff44f2a4a82da13d22061ce73443a125925d
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup testenv using external action
      uses: podman-desktop/e2e/.github/actions/pde2e-testenv-prepare@13e2c57c759137bfc1f437f221967461e8a98e2a

    - name: Remove pre-installed Docker images
      run: |
        echo "Removing pre-installed Docker images to prevent E2E test flakiness"
        docker image ls
        docker image rm --force $(docker image ls -q) 2>/dev/null || true
        docker system prune --all --force 2>/dev/null || true
        echo "Docker images after cleanup:"
        docker image ls

    # Download and install the Podman Desktop production binary (Linux & Windows) - nightly prereleases
    - name: Install Podman Desktop
      id: podman-desktop-install
      uses: podman-desktop/gh-extensions-actions/.github/actions/podman-desktop-install@0abcba929bec797400b7fc1d6229f2907e1d4c1d # v0.2.0
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      name: Install pnpm
      with:
        run_install: false
        package_json_file: ./podman-desktop/package.json

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: 'podman-desktop/.nvmrc'
        cache: 'pnpm'
        cache-dependency-path: podman-desktop/pnpm-lock.yaml

    - name: Execute pnpm
      working-directory: ./podman-desktop
      run: pnpm install

    - name: Install Playwright browser
      working-directory: ./podman-desktop
      run: npx playwright install chromium

    - name: Start forwarding proxy and export HTTP_PROXY/HTTPS_PROXY
      working-directory: ./podman-desktop
      run: |
        chmod +x tests/playwright/scripts/setup-proxy.sh
        tests/playwright/scripts/setup-proxy.sh start
        # Exported for the remainder of the job: the compile step and the
        # Podman Desktop process launched by the E2E run below inherit
        # these and Podman Desktop picks them up via its "System" proxy
        # mode (see packages/main/src/plugin/proxy-system.ts).
        echo "HTTP_PROXY=http://127.0.0.1:3128" >> "$GITHUB_ENV"
        echo "HTTPS_PROXY=http://127.0.0.1:3128" >> "$GITHUB_ENV"
        echo "http_proxy=http://127.0.0.1:3128" >> "$GITHUB_ENV"
        echo "https_proxy=http://127.0.0.1:3128" >> "$GITHUB_ENV"
        # Local/loopback traffic (e.g. the insecure test registry above)
        # must bypass the proxy - it isn't reachable from inside the
        # proxy's own container network namespace.
        echo "NO_PROXY=localhost,127.0.0.1,::1" >> "$GITHUB_ENV"
        echo "no_proxy=localhost,127.0.0.1,::1" >> "$GITHUB_ENV"

    - name: Run E2E tests in Production Mode
      working-directory: ./podman-desktop
      env:
        PODMANDESKTOP_CI_BOT_TOKEN: ${{ secrets.PODMANDESKTOP_CI_BOT_TOKEN }}
        SKIP_KIND_INSTALL: 'true'
        KIND_PROVIDER_GHA: ${{ env.KIND_PROVIDER }}
        DEBUGGING_PORT: 9222
        PODMAN_DESKTOP_BINARY: ${{ steps.podman-desktop-install.outputs.binary }}
      run: |
        pnpm ${{ env.NPM_TARGET }}

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
      if: always()
      with:
        fail_on_failure: true
        include_passed: true
        detailed_summary: true
        annotate_only: true
        require_tests: true
        report_paths: '**/*results.xml'

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: ${{ matrix.os }}-generic-server-update-e2e
        path: |
          ./**/tests/**/output/
          !./**/tests/**/traces/raw
          **/workflow-run-attributes.json

    - name: Dump proxy container logs on failure
      if: failure()
      run: |
        podman logs pd-test-proxy || true
        podman exec pd-test-proxy tail -n 500 /var/log/squid/access.log || true

    - name: Cleanup forwarding proxy
      working-directory: ./podman-desktop
      if: always()
      run: tests/playwright/scripts/setup-proxy.sh cleanup || true

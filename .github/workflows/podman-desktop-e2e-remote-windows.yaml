name: PD Podman-Remote E2E Nightly
run-name: PD E2E Podman Remote WSL - Podman ${{ inputs.podman_version || 'latest' }}

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      pd_repo_options:
        default: 'FORK=podman-desktop,BRANCH=main'
        description: 'Podman Desktop fork and branch'
        type: string
        required: true
      npm_target:
        default: 'test:e2e:remote:run'
        description: 'npm target to run tests'
        type: string
        required: true
      podman_version:
        default: 'latest'
        description: 'Podman version to install (e.g. "latest" or "v5.6.1")'
        type: string
        required: false
      env_vars:
        default: 'ELECTRON_ENABLE_INSPECT=true'
        description: 'Env. Variables passed to the test run, ie: VAR1=xxx,VAR2=true'
        type: 'string'
        required: false

jobs:
  windows:
    name: Windows Remote E2E
    timeout-minutes: 90
    runs-on: windows-2025
    permissions:
      contents: read

    steps:
    - name: Set the default env. variables
      shell: bash
      env:
        DEFAULT_PD_REPO_OPTIONS: 'FORK=podman-desktop,BRANCH=main'
        DEFAULT_NPM_TARGET: 'test:e2e:remote:run'
        DEFAULT_ENV_VARS: 'ELECTRON_ENABLE_INSPECT=true'
      run: |
        echo "${{ github.event.inputs.pd_repo_options || env.DEFAULT_PD_REPO_OPTIONS }}" | awk -F ',' \
          '{for (i=1; i<=NF; i++) {split($i, kv, "="); print kv[1]"="kv[2]}}' >> $GITHUB_ENV
        echo "NPM_TARGET=${{ github.event.inputs.npm_target || env.DEFAULT_NPM_TARGET }}" >> $GITHUB_ENV
        echo "${{ github.event.inputs.env_vars || env.DEFAULT_ENV_VARS }}" | awk -F ',' \
          '{for (i=1; i<=NF; i++) {split($i, kv, "="); print kv[1]"="kv[2]}}' >> $GITHUB_ENV

    - name: Checkout Podman Desktop
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ env.FORK }}/podman-desktop
        ref: ${{ env.BRANCH }}
        persist-credentials: false

    - name: Checkout E2E repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: podman-desktop/e2e
        path: e2e
        persist-credentials: false

    - name: Install Podman Desktop
      id: podman-desktop-install
      uses: podman-desktop/gh-extensions-actions/.github/actions/podman-desktop-install@e59cd52b942e8dfcc187293c5d8e9f3831c7ac0c # v0.11.0
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - name: Install npm dependencies
      run: pnpm install

    - name: Install Podman
      id: podman-install
      uses: redhat-actions/podman-install@aea6ff44f2a4a82da13d22061ce73443a125925d # v0.3.0
      with:
        podman-version-input: ${{ github.event.inputs.podman_version || 'latest' }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Podman remote machine connection
      shell: pwsh
      run: |
        & "${{ github.workspace }}/e2e/e2e-runner/lib/windows/scripts/remote_machine.ps1"
        if ($LASTEXITCODE -ne 0) { throw "remote_machine.ps1 failed with exit code $LASTEXITCODE" }

    - name: Run Podman Remote E2E tests
      shell: pwsh
      env:
        PODMANDESKTOP_CI_BOT_TOKEN: ${{ secrets.PODMANDESKTOP_CI_BOT_TOKEN }}
        PODMAN_DESKTOP_BINARY: ${{ steps.podman-desktop-install.outputs.binary }}
        DEBUGGING_PORT: 9222
      run: |
        Write-Host "Running: pnpm ${{ env.NPM_TARGET }}"
        Write-Host "Binary: $env:PODMAN_DESKTOP_BINARY"
        pnpm ${{ env.NPM_TARGET }}

    - name: Create json file with workflow run attributes
      if: always()
      uses: podman-desktop/e2e/.github/actions/generate-test-attributes@053dd9e2e4511c412dcaa835d884eec303797ed6
      with:
        filename: workflow-run-attributes.json
        runs-on-gh-runner: true
        podman-version: ${{ steps.podman-install.outputs.podman-version }}
        podman-provider: wsl

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
      if: always()
      with:
        fail_on_failure: true
        annotate_only: true
        include_passed: true
        detailed_summary: true
        require_tests: true
        report_paths: '**/*results.xml'

    - name: Upload test artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: windows-remote-e2e
        path: |
          ./tests/**/output/
          !./tests/**/traces/raw
          **/workflow-run-attributes.json

    - name: Notify Slack
      if: always()
      continue-on-error: true
      uses: podman-desktop/e2e/.github/actions/notify-slack@main
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
        status: ${{ job.status }}
        workflow-name: "${{ github.workflow }}"
        branch: ${{ env.BRANCH }}
